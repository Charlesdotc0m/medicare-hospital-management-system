{% extends 'base.html' %}

{% block content %}

<!-- Register Banner -->

<section class="bg-primary text-white text-center py-5">
    <div class="container">
        <h1 class="fw-bold">Patient Registration</h1>
        <p>Fill in your details to register with MediCare Hospital.</p>
    </div>
</section>

<!-- Registration Form -->

<section class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow p-4">

                <h3 class="text-center text-primary mb-4">
                    Register Here
                </h3>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        {{ form.patient_name }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        {{ form.patient_age }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        {{ form.patient_phone }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        {{ form.patient_email }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Problem / Symptoms</label>
                        {{ form.patient_problem }}
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-5">
                            Register
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</section>

{% endblock %}
